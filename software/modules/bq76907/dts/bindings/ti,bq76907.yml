description: |
  Texas Instruments BQ76907 battery protection
  When setting the battery DTS properties, make sure to include
  bq76907.h and use the macros defined there.

compatible: "ti,bq76907"

include: [sensor-device.yaml, i2c-device.yaml]

properties:
  alert-gpios:
    type: phandle-array
    description: |
      The alert pin signal defaults to active low open drain, so requires a
      pull-up on the board.